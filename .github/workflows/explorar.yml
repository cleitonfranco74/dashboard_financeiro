name: Explorar estatais (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [tmp_estatais/explorar.sh, .github/workflows/explorar.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: bash tmp_estatais/explorar.sh
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tmp_estatais; git commit -m "tmp: exploração estatais" || true; git push
