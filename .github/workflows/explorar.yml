name: Carga inicial dos municípios (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [scripts/atualizar_municipios.py, .github/workflows/explorar.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python scripts/atualizar_municipios.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/municipios.json; git commit -m "Carga inicial das finanças municipais" || true; git pull --rebase; git push
