name: Explorar dividendos (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [tmp_div/explorar.sh, .github/workflows/explorar.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tmp_div/explorar.sh
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tmp_div; git commit -m "tmp: dividendos" || true; git push
