name: Explorar municípios (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [tmp_mun/explorar.sh, .github/workflows/explorar.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash tmp_mun/explorar.sh
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tmp_mun; git commit -m "tmp: municípios" || true; git push
