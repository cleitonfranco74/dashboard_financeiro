name: Atualizar dados de mercado

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 19h de Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/atualizar_mercado.py

      - name: Ações, FIIs e ETFs do comparador
        run: python scripts/atualizar_acoes.py
        continue-on-error: true

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json data/acoes.json 2>/dev/null || git add data/mercado.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados de mercado ($(date -u +%Y-%m-%d))"
            git push
          fi
