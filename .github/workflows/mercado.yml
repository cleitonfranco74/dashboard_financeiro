name: Atualizar dados de mercado

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 19h de Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Sonda B3 (temporária)
        run: python scripts/sondar_b3.py
        continue-on-error: true

      - run: python scripts/atualizar_mercado.py

      - name: Ações, FIIs e ETFs do comparador
        run: python scripts/atualizar_acoes.py
        continue-on-error: true

      - name: Passagens para Roma
        run: python scripts/atualizar_voos.py
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json
          for f in data/acoes.json data/voos.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados de mercado ($(date -u +%Y-%m-%d))"
            git push
          fi
