name: Cotações durante o pregão

# Plantão contínuo: cada execução fica até ~5h40 de pé (scripts/plantao_cotacoes.sh), atualiza as cotações
# e os alertas de topo de hora em hora durante o pregão e, ao terminar, dispara a execução seguinte.
# O agendamento abaixo é só uma reserva para religar o plantão se a corrente parar: neste repositório o
# GitHub descarta a maior parte das execuções programadas.
on:
  schedule:
    - cron: "20 13,17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar a execução seguinte

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install yfinance

      # Os dados ficam no branch "dados", para não gerar commits na main a cada hora.
      - name: Branch de dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dados:dados
          git worktree add ../dados dados

      - name: Plantão (cotações e alertas de topo de hora em hora)
        run: bash scripts/plantao_cotacoes.sh

      - name: Dispara o próximo plantão
        if: ${{ !cancelled() }}   # cancelar uma execução encerra a corrente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cotacoes.yml --ref main
