name: Baixar logomarcas (temporário)
on:
  push:
    branches: [claude/charming-heisenberg-2sycep]
    paths: [scripts/baixar_logos.py, .github/workflows/logos.yml]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python scripts/baixar_logos.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add assets/logos; git commit -m "Logomarcas das estatais (Wikimedia Commons)" || true; git push
